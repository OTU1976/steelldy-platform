<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>STEELLDY / INDICES — Carbon & DeFi Intelligence</title>
<meta name="description" content="Institutional-grade carbon credit and DeFi yield indices for CSRD/Pillar Two compliance."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#03060E;--bg2:#060B18;--bg3:#080F1E;--bg4:#0A1020;
  --gold:#C8973A;--goldL:#E8B44A;--goldD:#8A620A;
  --cyan:#0DC9D4;--blue:#1D6FA4;--blueL:#2A8FD4;
  --green:#17C96A;--red:#E34A4A;--amber:#F0A030;
  --purple:#8B5CF6;--pink:#EC4899;--teal:#0A9090;
  --text:#C4CDD8;--textD:#7A8CA0;--white:#EEF2F8;
  --bord:#0F1A2E;--bord2:#1A2D48;
  --r:8px;--r2:14px;
}
html,body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden}
.mono{font-family:'Space Mono',monospace}
.serif{font-family:'DM Serif Display',serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(3,6,14,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--bord);padding:0 32px;display:flex;align-items:center;height:56px;gap:32px}
.logo{font-family:'Space Mono',monospace;font-size:17px;font-weight:700;color:var(--gold);letter-spacing:.14em;cursor:pointer;white-space:nowrap}
.logo span{color:var(--textD);font-size:9px;display:block;letter-spacing:.2em;margin-top:-2px}
.nav-links{display:flex;gap:4px;flex:1}
.nl{background:none;border:none;color:var(--textD);font-family:'Syne',sans-serif;font-size:13px;font-weight:500;padding:8px 14px;cursor:pointer;border-radius:var(--r);transition:.2s}
.nl:hover{color:var(--white);background:rgba(255,255,255,.04)}
.nl.act{color:var(--gold)}
.nav-cta{background:var(--gold);color:var(--bg);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;padding:8px 18px;border:none;border-radius:var(--r);cursor:pointer;transition:.2s;white-space:nowrap}
.nav-cta:hover{background:var(--goldL)}
.live-tag{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--green);font-family:'Space Mono',monospace;letter-spacing:.08em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}

/* TICKER */
.ticker-wrap{background:var(--bg2);border-bottom:1px solid var(--bord);height:28px;overflow:hidden;display:flex;align-items:center}
.ticker-inner{display:flex;animation:ticker 32s linear infinite;white-space:nowrap}
.ti{font-family:'Space Mono',monospace;font-size:10px;color:var(--textD);padding:0 24px;display:flex;gap:8px;align-items:center}
.ti span{color:var(--white)}
.ti .up{color:var(--green)}
.ti .dn{color:var(--red)}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--bord);border-radius:var(--r2);padding:20px}
.card-gold{border-top:2px solid var(--gold)}
.card-green{border-top:2px solid var(--green)}
.card-blue{border-top:2px solid var(--blueL)}
.card-cyan{border-top:2px solid var(--cyan)}
.card-red{border-top:2px solid var(--red)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border:none;border-radius:var(--r);font-family:'Syne',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:.2s;white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--bg)}.btn-gold:hover{background:var(--goldL)}
.btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold)}.btn-outline:hover{background:rgba(200,151,58,.1)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--bord)}.btn-ghost:hover{background:rgba(255,255,255,.08)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#c43a3a}
.btn-green{background:var(--green);color:var(--bg)}.btn-green:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FORM INPUTS */
.inp{width:100%;background:var(--bg3);border:1px solid var(--bord2);border-radius:var(--r);padding:11px 14px;color:var(--white);font-family:'Syne',sans-serif;font-size:14px;outline:none;transition:.2s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,151,58,.1)}
.inp::placeholder{color:var(--textD)}
label.lbl{display:block;font-size:12px;color:var(--textD);margin-bottom:6px;letter-spacing:.04em;font-weight:600;text-transform:uppercase}

/* PAGE WRAPPER */
.page{min-height:100vh;padding-top:84px;animation:fadeUp .35s ease forwards}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-family:'Space Mono',monospace;padding:3px 9px;border-radius:20px;letter-spacing:.06em}
.badge-gold{background:rgba(200,151,58,.12);color:var(--gold);border:1px solid rgba(200,151,58,.25)}
.badge-green{background:rgba(23,201,106,.1);color:var(--green);border:1px solid rgba(23,201,106,.2)}
.badge-red{background:rgba(227,74,74,.1);color:var(--red);border:1px solid rgba(227,74,74,.2)}
.badge-blue{background:rgba(42,143,212,.1);color:var(--blueL);border:1px solid rgba(42,143,212,.2)}
.badge-amber{background:rgba(240,160,48,.1);color:var(--amber);border:1px solid rgba(240,160,48,.2)}

/* MODAL OVERLAY */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--bord2);border-radius:var(--r2);padding:36px;max-width:480px;width:100%;animation:fadeUp .25s ease}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg3);border-radius:var(--r);padding:4px}
.tab{padding:8px 16px;border:none;background:none;color:var(--textD);font-family:'Syne',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border-radius:6px;transition:.2s}
.tab.act{background:var(--bg2);color:var(--white);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tab:hover:not(.act){color:var(--white)}

/* STAT ROW */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bord);font-size:12px}
.stat-row:last-child{border-bottom:none}
.stat-label{color:var(--textD)}
.stat-value{font-family:'Space Mono',monospace;color:var(--white);font-size:11px}

/* GRID HELPERS */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.nav-links{display:none}}

/* SPINNER */
.spinner{width:20px;height:20px;border:2px solid rgba(200,151,58,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}

/* INDEX SCORE RING */
.score-ring{position:relative;display:inline-flex;align-items:center;justify-content:center}

/* ALERT */
.alert{padding:12px 16px;border-radius:var(--r);font-size:13px;margin-bottom:16px}
.alert-error{background:rgba(227,74,74,.08);border:1px solid rgba(227,74,74,.25);color:#f87171}
.alert-success{background:rgba(23,201,106,.08);border:1px solid rgba(23,201,106,.25);color:var(--green)}
.alert-info{background:rgba(42,143,212,.08);border:1px solid rgba(42,143,212,.25);color:var(--blueL)}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{color:var(--textD);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--bord);text-align:left;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--bord);color:var(--text);font-family:'Space Mono',monospace;font-size:11px}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.02)}

/* SECTION HEADING */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.sec-title{font-size:14px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.08em}
.sec-sub{font-size:12px;color:var(--textD);margin-top:3px}

/* INDEX VALUE CARD */
.idx-card{background:var(--bg3);border:1px solid var(--bord);border-radius:var(--r2);padding:18px;cursor:pointer;transition:.2s}
.idx-card:hover{border-color:var(--bord2);background:var(--bg4)}
.idx-val{font-family:'DM Serif Display',serif;font-size:36px;margin:8px 0 4px}
.idx-change{font-family:'Space Mono',monospace;font-size:11px}

/* PRICING CARD */
.price-card{background:var(--bg2);border:1px solid var(--bord);border-radius:var(--r2);padding:28px;transition:.2s;position:relative}
.price-card.featured{border-color:var(--gold);box-shadow:0 0 32px rgba(200,151,58,.1)}
.price-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.price-amount{font-family:'DM Serif Display',serif;font-size:44px;color:var(--white)}
.price-amount sup{font-size:20px;vertical-align:super;font-family:'Syne',sans-serif;color:var(--textD)}
.price-amount sub{font-size:14px;vertical-align:baseline;font-family:'Syne',sans-serif;color:var(--textD)}
.feat-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin-bottom:10px}
.feat-item::before{content:'→';color:var(--gold);font-family:'Space Mono',monospace;flex-shrink:0;margin-top:1px}

/* LOCKED OVERLAY */
.locked{position:relative;overflow:hidden}
.locked::after{content:'🔒 Upgrade required';position:absolute;inset:0;background:rgba(3,6,14,.85);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--textD);border-radius:var(--r2)}

/* ADMIN SPECIFIC */
.admin-sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bord);min-height:calc(100vh - 56px);padding:20px 0}
.admin-nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;font-weight:600;color:var(--textD);cursor:pointer;transition:.2s;border-left:2px solid transparent}
.admin-nav-item:hover{color:var(--white);background:rgba(255,255,255,.03)}
.admin-nav-item.act{color:var(--gold);border-left-color:var(--gold);background:rgba(200,151,58,.05)}

/* STATUS DOT */
.status-live{color:var(--green)}
.status-delayed{color:var(--amber)}
.status-error{color:var(--red)}
</style>
</head>

// ═══════════════════════════════════════════════════════════════
// LIVE DATA HOOK
// ═══════════════════════════════════════════════════════════════
function useLiveData(){
  const [data,setData]=useState({
    ccqi:72.0, dyoi:64.3, eua:72.86, tvl:72.7, aave:2.9,
    ccqiChg:+0.13, dyoiChg:+1.2,

      ...d,
      ccqi:parseFloat((d.ccqi+(Math.random()-.5)*.3).toFixed(1)),

      ts:new Date().toISOString()

    const id=setInterval(tick,8000);
    return()=>clearInterval(id);
  },[]);
  return data;
}

function Ticker({data}){

    {l:'AAVE APY',v:data.aave.toFixed(1)+'%'},
    {l:'VERRA VCU',v:'90/100'},

    {l:'PILLAR TWO',v:'EXPOSURE'},
    {l:'CSRD STATUS',v:'COMPLIANT'},
    {l:'BMR/IOSCO',v:'ALIGNED'},
  ];
  const both=[...items,...items];
  return h('div',{className:'ticker-wrap'},
    h('div',{className:'ticker-inner'},
      both.map((it,i)=>
        h('div',{key:i,className:'ti'},
          h('span',{style:{color:'var(--textD)',marginRight:4}},it.l),
          h('span',null,it.v),
          it.c&&h('span',{className:it.c},` ${it.ch}`)
        )
      )
    )
  );

  const [success,setSuccess]=useState('');

    if(user){

      onLogin(user);
    } else {

    setLoading(false);

  const handleSignup=async(e)=>{
    e.preventDefault();

    setSuccess('Account created! A confirmation email has been sent. Please check your inbox.');

  return h('div',{className:'page',style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'84px 20px 40px'}},

        ),
        error&&h('div',{className:'alert alert-error'},error),
        success&&h('div',{className:'alert alert-success'},success),
        !success&&h('form',{onSubmit:mode==='login'?handleLogin:handleSignup},

// PRICING PAGE
// ═══════════════════════════════════════════════════════════════
function PricingPage({goTo,user}){
  const [loading,setLoading]=useState(null);
  const [msg,setMsg]=useState('');

  const handleStripe=async(plan)=>{
    if(!user){goTo('auth');return;}
    setLoading(plan.id);setMsg('');
    try{
      const stripe=Stripe(CONFIG.STRIPE_KEY);
      const {error}=await stripe.redirectToCheckout({
        lineItems:[{price:plan.priceId,quantity:1}],
        mode:'subscription',
        successUrl:window.location.origin+'?session=success&plan='+plan.id,
        cancelUrl:window.location.origin+'?session=cancel',
        customerEmail:user.email,
      });
      if(error)setMsg(error.message);
    }catch(e){
      setMsg('Stripe not configured. Contact contact@steelldy.com to subscribe.');
    }
    setLoading(null);
  };

  return h('div',{className:'page',style:{padding:'100px 48px 80px',maxWidth:1200,margin:'0 auto'}},
    h('div',{style:{textAlign:'center',marginBottom:56}},
      h('div',{style:{fontFamily:'Space Mono',fontSize:10,color:'var(--textD)',letterSpacing:'.2em',marginBottom:12,textTransform:'uppercase'}},'— Subscription Plans'),
      h('h2',{className:'serif',style:{fontSize:48,color:'var(--white)',marginBottom:16}},'Institutional Pricing'),
      h('p',{style:{color:'var(--textD)',fontSize:15,maxWidth:480,margin:'0 auto'}},
        'Designed for compliance officers, risk managers and institutional investors requiring CSRD and Pillar Two reporting.')
    ),
    msg&&h('div',{className:'alert alert-info',style:{maxWidth:640,margin:'0 auto 24px'}},msg),
    h('div',{className:'grid-3',style:{gap:20,maxWidth:1000,margin:'0 auto'}},
      PLANS.map(plan=>
        h('div',{key:plan.id,className:`price-card${plan.badge==='MOST POPULAR'?' featured':''}`,style:{borderTop:`3px solid ${plan.accent}`}},
          plan.badge&&h('div',{style:{position:'absolute',top:-1,right:20,background:plan.accent,color:plan.id==='professional'?'#03060E':'#fff',fontSize:10,fontWeight:700,padding:'4px 10px',borderRadius:'0 0 6px 6px',letterSpacing:'.08em'}},plan.badge),
          h('div',{style:{fontSize:12,color:'var(--textD)',fontFamily:'Space Mono',letterSpacing:'.1em',marginBottom:8,textTransform:'uppercase'}},plan.name),
          h('div',{style:{marginBottom:16}},
            h('span',{className:'price-amount'},
              h('sup',null,plan.currency),plan.price,h('sub',null,plan.period)
            )
          ),
          h('p',{style:{fontSize:13,color:'var(--textD)',marginBottom:20,lineHeight:1.6}},plan.description),
          h('div',{style:{marginBottom:24}},
            plan.features.map((f,i)=>h('div',{key:i,className:'feat-item'},f))
          ),
          h('button',{
            className:'btn btn-gold',
            style:{width:'100%',padding:'12px',background:loading===plan.id?'var(--goldD)':plan.accent==='#C8973A'?'var(--gold)':plan.accent,color:plan.accent==='#64748b'?'#fff':'var(--bg)'},
            onClick:()=>handleStripe(plan),
            disabled:loading===plan.id
          },
            loading===plan.id?h('div',{className:'spinner'}):user&&user.tier===plan.id?'Current Plan ✓':'Subscribe →'
          )
        )
      )
    ),
    h('div',{style:{textAlign:'center',marginTop:48,color:'var(--textD)',fontSize:13}},
      'Enterprise/custom pricing? ',
      h('a',{href:'mailto:contact@steelldy.com',style:{color:'var(--gold)'}},'contact@steelldy.com')
    )
  );
}

  const [pw,setPw]=useState('');

  const [attempts,setAttempts]=useState(0);

  const handle=(e)=>{
    e.preventDefault();
    if(pw===CONFIG.ADMIN_PASSWORD){
      sessionStorage.setItem('steelldy_admin','1');
      onAuth(true);
    } else {
      setAttempts(a=>a+1);
      setErr(`Incorrect password. Attempt ${attempts+1}/5.`);
      if(attempts>=4)setErr('Too many attempts. Access locked.');
    }
  };
  return h('div',{className:'page',style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'84px 20px'}},

      h('div',{className:'card'},
        err&&h('div',{className:'alert alert-error'},err),
        h('form',{onSubmit:handle},
          h('div',{style:{marginBottom:20}},

// ═══════════════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════════════
function App(){
  const [page,setPage]=useState('home');
  const [user,setUser]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('steelldy_user'));}catch{return null;}
  });
  const [adminAuth,setAdminAuth]=useState(()=>sessionStorage.getItem('steelldy_admin')==='1');
  const data=useLiveData();

  const goTo=(p)=>{window.scrollTo(0,0);setPage(p);};

  const handleLogin=(u)=>{setUser(u);goTo('dashboard');};
  const handleLogout=()=>{localStorage.removeItem('steelldy_user');setUser(null);goTo('home');};

  // Check URL params for Stripe return
  useEffect(()=>{
    const p=new URLSearchParams(window.location.search);
    if(p.get('session')==='success'){
      window.history.replaceState({},'',window.location.pathname);
      goTo('dashboard');
    }
  },[]);

  return h('div',null,
    // NAVIGATION
    h('nav',null,
      h('div',{className:'logo',onClick:()=>goTo('home')},
        'STEELLDY',h('span',null,'INDEX INTELLIGENCE PLATFORM')
      ),
      h('div',{className:'nav-links'},
        h('button',{className:`nl${page==='home'?' act':''}`,onClick:()=>goTo('home')},'Indices'),
        h('button',{className:`nl${page==='dashboard'?' act':''}`,onClick:()=>user?goTo('dashboard'):goTo('auth')},'Dashboard'),
        h('button',{className:`nl${page==='pricing'?' act':''}`,onClick:()=>goTo('pricing')},'Pricing'),
        h('button',{className:`nl${page==='admin'?' act':''}`,onClick:()=>goTo('admin'),style:{color:'var(--red)',opacity:.6}},'Admin'),
      ),
      h('div',{style:{display:'flex',alignItems:'center',gap:10}},
        h('div',{className:'live-tag'},h('div',{className:'dot'}),'LIVE'),
        user?
          h('div',{style:{display:'flex',gap:8,alignItems:'center'}},
            h('span',{style:{fontFamily:'Space Mono',fontSize:10,color:'var(--textD)'}},[user.name]),
            h('button',{className:'btn btn-ghost',style:{fontSize:11,padding:'6px 12px'},onClick:handleLogout},'Sign Out')
          ):
          h('button',{className:'nav-cta',onClick:()=>goTo('auth')},'Sign In')
      )
    ),
    // PAGES
    page==='home'&&h(HomePage,{goTo,data}),
    page==='auth'&&h(AuthPage,{onLogin:handleLogin,goTo}),
    page==='pricing'&&h(PricingPage,{goTo,user}),
    page==='dashboard'&&(
      user?h(UserDashboard,{user,data,goTo}):h(AuthPage,{onLogin:handleLogin,goTo})
    ),
    page==='admin'&&(
      adminAuth?h(AdminPanel,{data,goTo}):h(AdminLogin,{onAuth:setAdminAuth})
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
