name: STEELLDY Full Index Suite

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '30 * * * *'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  core-indices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests supabase yfinance python-dotenv
      - name: Run CCQI
        run: python scripts/steelldy_ccqi.py
      - name: Run DYOI
        run: python scripts/steelldy_dyoi.py

  free-indices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests supabase python-dotenv
      - name: Run 7 Free Indices
        run: python scripts/steelldy_free_indices.py